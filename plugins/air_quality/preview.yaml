  sensor.living_humidity: { state: "48", attributes: { unit_of_measurement: "%", device_class: humidity } }
  sensor.studio_co2: { state: "1340", attributes: { unit_of_measurement: ppm, device_class: carbon_dioxide } }
  sensor.studio_pm25: { state: "6", attributes: { unit_of_measurement: "µg/m³", device_class: pm25 } }

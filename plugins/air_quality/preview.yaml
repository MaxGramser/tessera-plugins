# What tools/preview.py shows (docs/PREVIEW.md): rooms with an AirGradient ONE's sensors, in the states the tile has
# to say something about, a room with one loose CO2 sensor, and a day of humidity for the rooms that judge how even
# it stayed.
tiles:
  - tile: room
    name: Living room
    options: { room: living, co2: sensor.living_co2, pm25: sensor.living_pm25, voc: sensor.living_voc, nox: sensor.living_nox, temperature: sensor.living_temperature, humidity: sensor.living_humidity }
    sizes: [1x1, 2x1, 1x2, 2x2, 1x3, 3x2, 4x3]
  - tile: room
    name: Studio
    options: { room: studio, co2: sensor.studio_co2, pm25: sensor.studio_pm25, voc: sensor.studio_voc, nox: sensor.studio_nox, temperature: sensor.studio_temperature, humidity: sensor.studio_humidity }
    sizes: [1x1, 2x1, 2x2, 3x2]
  - tile: room
    name: Bedroom
    options: { room: bedroom, co2: sensor.bed_co2, pm25: sensor.bed_pm25, temperature: sensor.bed_temperature, humidity: sensor.bed_humidity }
    sizes: [1x1, 2x2]
  - tile: room
    name: Gallery
    options: { room: gallery, co2: sensor.living_co2, pm25: sensor.living_pm25, temperature: sensor.living_temperature, humidity: sensor.living_humidity }
    sizes: [1x1, 2x2]
  - tile: room
    name: Workshop
    options: { room: workshop, co2: sensor.shop_co2, pm25: sensor.shop_pm25, pm10: sensor.shop_pm10, voc: sensor.shop_voc, nox: sensor.shop_nox, temperature: sensor.shop_temperature, humidity: sensor.shop_humidity }
    sizes: [2x1, 2x2]
  - tile: room
    name: Office
    options: { room: office, co2: sensor.office_co2, co2_max: 1000 }
    sizes: [1x1, 2x1]
  - tile: room
    name: No sensors
    sizes: [1x1]

states:
  sensor.living_co2: { state: "612", attributes: { unit_of_measurement: ppm, device_class: carbon_dioxide } }
  sensor.living_pm25: { state: "4", attributes: { unit_of_measurement: "µg/m³", device_class: pm25 } }

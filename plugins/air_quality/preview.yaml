# The last 24 hours as Home Assistant's statistics give them: one row an hour, oldest first. Every question gets this
# answer here, so it is a day of humidity: 42 to 53 %.
commands:
  "recorder/statistics_during_period":
    sensor.humidity:
        - { mean: 43.0, min: 42.0, max: 44.0 }
        - { mean: 43.2, min: 42.2, max: 44.2 }
        - { mean: 43.6, min: 42.6, max: 44.6 }
